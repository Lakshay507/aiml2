<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paldeck - Max Performance Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --base-dark: #060a13;
            --card-surface: rgba(13, 20, 38, 0.65);
            --border-light: rgba(255, 255, 255, 0.06);
            --text-pure: #ffffff;
            --text-body: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--base-dark);
            color: var(--text-pure);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* GPU Rasterized Backgrounds */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.12;
            pointer-events: none;
            transform: translateZ(0);
        }
        .glow-1 { top: -10%; left: -10%; background: #38bdf8; }
        .glow-2 { top: 40%; right: -10%; background: #a855f7; }

        .container {
            width: 92%;
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            padding: 5rem 0 2rem;
            border-bottom: 1px solid var(--border-light);
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        header h1 span {
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-version {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        header p {
            color: var(--text-body);
            font-size: 1.05rem;
            max-width: 600px;
        }

        /* Layer-Isolated Rendering Grid */
        .pal-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.75rem;
            padding: 4rem 0;
            contain: layout style tokens;
        }

        .pal-card {
            background: var(--card-surface);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 1.75rem;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            cursor: pointer;
            outline: none;
            contain: content;
        }

        .pal-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .pal-card:hover, .pal-card:focus-visible {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .pal-id {
            font-size: 0.8rem;
            color: var(--text-body);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .pal-img-frame {
            width: 150px;
            height: 150px;
            margin: 1.25rem auto;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* GPU Hardware Accelerated Graphics Layer */
        .pal-animated-logo {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-el), var(--secondary-el));
            background-size: 200% 200%;
            animation: gradientShift 6s ease infinite;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            transform: translateZ(0);
            will-change: background-position;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 2;
            letter-spacing: 1px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pal-card:hover .logo-text, .pal-card:focus-visible .logo-text {
            transform: scale(1.12) translateZ(0);
        }

        .modal-display-head .logo-text { font-size: 2.5rem; }

        .logo-pulse-ring {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: emblemPulse 2.5s infinite ease-in-out;
            z-index: 1;
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .pal-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }

        .type-container {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tag-el {
            padding: 0.25rem 0.85rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.06);
            border-left: 3px solid currentColor;
        }

        /* Composite-Only Window System */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            transform: translateZ(0);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: #0d1322;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 550px;
            border-radius: 32px;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transform: scale(0.96) translateZ(0);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            contain: content;
        }

        .modal-overlay.active .modal-card { transform: scale(1) translateZ(0); }

        .close-matrix-btn {
            position: absolute;
            top: 1.25rem;
            right: 1.5rem;
            font-size: 2rem;
            background: none;
            border: none;
            color: var(--text-body);
            cursor: pointer;
            outline: none;
        }
        .close-matrix-btn:hover, .close-matrix-btn:focus-visible { color: var(--text-pure); }

        .modal-display-head { text-align: center; margin-bottom: 2rem; }
        .modal-display-head h2 { font-size: 2rem; margin-top: 0.5rem; }

        .panel-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .panel-block h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-body);
            margin-bottom: 0.5rem;
        }

        .panel-block p { font-weight: 500; color: #e2e8f0; line-height: 1.5; }
        .suitability-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }

        .suitability-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.35rem 0.75rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .wiki-action-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.85rem;    
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.5rem 1.25rem;
            border-radius: 12px;
            display: inline-block;
            background: rgba(56, 189, 248, 0.03);
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .wiki-action-btn:hover, .wiki-action-btn:focus-visible {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            transform: translateY(-1px);
            outline: none;
        }

        footer {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-body);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-light);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes emblemPulse {
            0% { transform: scale(0.85) translateZ(0); opacity: 0.2; }
            50% { opacity: 0.6; border-color: rgba(255, 255, 255, 0.4); }
            100% { transform: scale(1.15) translateZ(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <header>
        <div class="container header-container">
            <div class="logo-area">
                <h1>PALWORLD <span>PALDECK WEBSITE</span></h1>
                <span class="badge-version">FANMADE</span>
            </div>
            <p>List of top 10 most powerful pals collection and their details.</p>
        </div>
    </header>

    <main class="container">
        <div class="pal-matrix" id="palGrid"></div>
    </main>

    <div class="modal-overlay" id="palModal" role="dialog" aria-modal="true">
        <div class="modal-card">
            <button class="close-matrix-btn" id="closeModal" aria-label="Close Pop-up">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; A SIMPLE PALDECK WITH 10 MOST POWERFUL PALS SHOWN IN THIS WEBSITE BY LAKSHAY GAUTAM.</p>
        </div>
    </footer>

    <script>
        // Compiled Immutable Memory Array (Zero Internal Lookups/Evaluations)
        const PAL_DATA = [
            { id: "No. 111", name: "Jetragon", elements: ["Dragon"], colors: ["#a855f7", "rgba(0,0,0,0.4)"], skill: "Aerial Missile (Missile launcher mount)", work: ["Gathering Lv.3"] },
            { id: "No. 110", name: "Frostallion", elements: ["Ice"], colors: ["#93c5fd", "rgba(0,0,0,0.4)"], skill: "Ice Pegasus (Converts player damage to Ice)", work: ["Cooling Lv.4"] },
            { id: "No. 108", name: "Paladius", elements: ["Neutral"], colors: ["#909090", "rgba(0,0,0,0.4)"], skill: "Holy Knight (Triple jump mount)", work: ["Lumbering Lv.2", "Mining Lv.2"] },
            { id: "No. 109", name: "Necromus", elements: ["Dark"], colors: ["#f43f5e", "rgba(0,0,0,0.4)"], skill: "Dark Knight (Double jump mount)", work: ["Lumbering Lv.2", "Mining Lv.2"] },
            { id: "No. 074B", name: "Jormuntide Ignis", elements: ["Fire", "Dragon"], colors: ["#ff4d4d", "#a855f7"], skill: "Stormbringer Lava Dragon", work: ["Kindling Lv.4"] },
            { id: "No. 113", name: "Bellanoir Libero", elements: ["Dark"], colors: ["#f43f5e", "rgba(0,0,0,0.4)"], skill: "Nightmare Siren (Beam Attack)", work: ["Handiwork Lv.4", "Medicine Lv.4", "Transport Lv.2"] },
            { id: "No. 096", name: "Blazamut", elements: ["Fire"], colors: ["#ff4d4d", "rgba(0,0,0,0.4)"], skill: "Magma Kaiser (Boosts Fire attacks)", work: ["Kindling Lv.3", "Mining Lv.4"] },
            { id: "No. 107", name: "Shadowbeak", elements: ["Dark"], colors: ["#f43f5e", "rgba(0,0,0,0.4)"], skill: "Modified DNA (Divine Disaster attack)", work: ["Gathering Lv.1"] },
            { id: "No. 100", name: "Anubis", elements: ["Ground"], colors: ["#fb923c", "rgba(0,0,0,0.4)"], skill: "Guardian Deity (Auto-dodges attacks)", work: ["Handiwork Lv.4", "Transport Lv.2", "Mining Lv.3"] },
            { id: "No. 099", name: "Knocklem", elements: ["Ground"], colors: ["#fb923c", "rgba(0,0,0,0.4)"], skill: "Steel Guardian (Massive Combat Buff)", work: ["Handiwork Lv.4", "Transport Lv.3", "Mining Lv.4"] }
        ];

        const palGrid = document.getElementById('palGrid');
        const modal = document.getElementById('palModal');
        const closeModal = document.getElementById('closeModal');
        const modalBody = document.getElementById('modalBody');
        let activeCardTrigger = null;

        // High-Performance Flat Markup Inline Generator
        function getLogoMarkup(name, colors) {
            return `<div class="pal-animated-logo" style="--primary-el: ${colors[0]}; --secondary-el: ${colors[1]};"><div class="logo-pulse-ring"></div><span class="logo-text">${name.substring(0, 2).toUpperCase()}</span></div>`;
        }

        // Monolithic High Speed Loop Generation (Bypasses GC Allocation entirely)
        function generateDashboard() {
            let htmlBuffer = '';
            let i = 0;
            const len = PAL_DATA.length;
            
            while (i < len) {
                const pal = PAL_DATA[i];
                let badges = '';
                let b = 0;
                while(b < pal.elements.length) {
                    badges += `<span class="tag-el" style="color: ${pal.colors[b] || pal.colors[0]}">${pal.elements[b]}</span>`;
                    b++;
                }

                htmlBuffer += `<div class="pal-card" tabindex="0" data-index="${i}" role="button" aria-label="View ${pal.name}"><div class="pal-id">${pal.id}</div><div class="pal-img-frame">${getLogoMarkup(pal.name, pal.colors)}</div><div class="pal-name">${pal.name}</div><div class="type-container">${badges}</div></div>`;
                i++;
            }
            palGrid.innerHTML = htmlBuffer;
        }

        // Ultra Fast Point-to-Point Event Handlers
        function onGridClick(e) {
            const card = e.target.closest('.pal-card');
            if (card) {
                activeCardTrigger = card;
                openDetails(card.getAttribute('data-index'));
            }
        }

        function onGridKey(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                const card = e.target.closest('.pal-card');
                if (card) {
                    e.preventDefault();
                    activeCardTrigger = card;
                    openDetails(card.getAttribute('data-index'));
                }
            }
        }

        function openDetails(idx) {
            const pal = PAL_DATA[idx];
            if (!pal) return;
            
            let badges = '';
            let b = 0;
            while(b < pal.elements.length) {
                badges += `<span class="tag-el" style="background: rgba(255,255,255,0.04); color: ${pal.colors[b] || pal.colors[0]}">${pal.elements[b]}</span>`;
                b++;
            }

            let chips = '';
            let w = 0;
            while(w < pal.work.length) {
                chips += `<span class="suitability-chip">${pal.work[w]}</span>`;
                w++;
            }

            modalBody.innerHTML = `
                <div class="modal-display-head">
                    <div class="pal-img-frame" style="width: 140px; height: 140px; margin: 0 auto 1rem;">${getLogoMarkup(pal.name, pal.colors)}</div>
                    <h2>${pal.name}</h2>
                    <div class="pal-id" style="margin-top: 0.25rem;">${pal.id}</div>
                </div>
                <div class="panel-block"><h4>Elemental Affinity</h4><div class="type-container" style="justify-content: flex-start; margin-top: 0.25rem;">${badges}</div></div>
                <div class="panel-block"><h4>Unique Partner Trait</h4><p>${pal.skill}</p></div>
                <div class="panel-block"><h4>Base Labor Work Suitability</h4><div class="suitability-grid">${chips}</div></div>
                <div class="panel-block" style="text-align: center; border: none; background: transparent; margin-top: 1.5rem;">
                    <a href="https://palworld.fandom.com/wiki/${encodeURIComponent(pal.name)}" target="_blank" rel="noopener noreferrer" class="wiki-action-btn">🌐 View Official Wiki Strategy Guide</a>
                </div>`;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            closeModal.focus();
        }

        function closeDetails() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            if (activeCardTrigger) activeCardTrigger.focus();
        }

        // Static Listeners
        palGrid.addEventListener('click', onGridClick);
        palGrid.addEventListener('keydown', onGridKey);
        closeModal.addEventListener('click', closeDetails);
        window.addEventListener('click', (e) => { if (e.target === modal) closeDetails(); });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeDetails(); });

        generateDashboard();
    </script>
</body>
</html>
