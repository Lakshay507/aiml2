<body><script>
function sum(...values){
    let total = 0;
    for (let i in values) {
        total += values[i];
    }
    console.log("Sum: ", total);
}
var a1= [1,2,3,4];
var a2= [5,6,7];
var a3= [...a1, ...a2]; //concatenation of two arrays using spread operator
console.log(a3);

sum(...a3); //spread operator -->

let name = "Mohd";
let rollNo = 123;
let data = {name, rollNo}; //object literal
console.log(data.name);
console.log(data.rollNo);

let F="firstName";
let L="lastName";
let data={
    [F] : "Mohd",
    [L] : "Sheeraz",
    show(){
    console.log(this.firstName);
    console.log(this.lastName);
}
};

console.log(data.show()); // can also be called as data.show() or data['show']() or data['show']
console.log(data.firstName);
console.log(data.lastName);

    let data = ["Lakshaya", 103, 242001, "Ghaziabad"];

    // Destructuring
    let[name, rollNo, pinCode, city] = data;
    console.log(name);
    console.log(rollNo);

    console.log(city);
    </script>
