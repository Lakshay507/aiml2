<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #141414;
            color: #fff;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            color: #e50914;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-right input {
            padding: 5px;
            border: none;
            border-radius: 4px;
        }

        .profile {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #777;
        }

        /* Hero */
        .hero {
            height: 90vh;
            background: url('https://images.unsplash.com/photo-1608889175123-8ee362201f81') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }

        .hero h1 {
            font-size: 50px;
        }

        .hero p {
            max-width: 500px;
            margin: 10px 0;
        }

        .btn {
            padding: 10px 20px;
            background: #e50914;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Rows */
        .row {
            margin: 20px;
        }

        .row h2 {
            margin-bottom: 10px;
        }

        .movies {
            display: flex;
            overflow-x: auto;
            gap: 10px;
        }

        .movies::-webkit-scrollbar {
            display: none;
        }

        .card {
            min-width: 200px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        .card img {
            width: 100%;
            border-radius: 5px;
        }

        .card:hover {
            transform: scale(1.1);
        }

        .card .info {
            position: absolute;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            width: 100%;
            padding: 10px;
            opacity: 0;
            transition: 0.3s;
        }

        .card:hover .info {
            opacity: 1;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal video {
            width: 70%;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }

        /* Responsive */
        @media(max-width:768px) {
            .hero h1 {
                font-size: 30px;
            }

            .card {
                min-width: 140px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">NETFLIX</div>
        <div class="nav-right">
            <input type="text" id="search" placeholder="Search">
            <div class="profile"></div>
        </div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <h1>Stranger Things</h1>
        <p>When a young boy vanishes, a small town uncovers a mystery involving secret experiments.</p>
        <button class="btn" onclick="playVideo()">▶ Play</button>
    </div>

    <!-- Movie Rows -->
    <div id="content"></div>

    <!-- Modal -->
    <div class="modal" id="modal" onclick="closeVideo()">
        <video controls autoplay src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Netflix Clone | Demo Project</p>
    </footer>

    <script>
        // Movie Data
        const data = {
            "Trending": [
                { name: "Movie 1", img: "https://picsum.photos/200/300?1" },
                { name: "Movie 2", img: "https://picsum.photos/200/300?2" },
                { name: "Movie 3", img: "https://picsum.photos/200/300?3" }
            ],
            "Top Rated": [
                { name: "Movie 4", img: "https://picsum.photos/200/300?4" },
                { name: "Movie 5", img: "https://picsum.photos/200/300?5" }
            ],
            "Comedy": [
                { name: "Movie 6", img: "https://picsum.photos/200/300?6" },
                { name: "Movie 7", img: "https://picsum.photos/200/300?7" }
            ]
        };

        // Render Movies
        const container = document.getElementById("content");
        function renderMovies(filter = "") {
            container.innerHTML = "";
            for (let category in data) {
                let row = `<div class='row'><h2>${category}</h2><div class='movies'>`;
                data[category].forEach(movie => {
                    if (movie.name.toLowerCase().includes(filter)) {
                        row += `
<div class='card'>
<img src='${movie.img}'>
<div class='info'>${movie.name}<br>
<button onclick="addToList('${movie.name}')">+ My List</button>
</div>
</div>`;
                    }
                });
                row += "</div></div>";
                container.innerHTML += row;
            }
        }
        renderMovies();

        // Search
        search.addEventListener("keyup", e => {
            renderMovies(e.target.value.toLowerCase());
        });

        // Modal
        function playVideo() {
            document.getElementById("modal").style.display = "flex";
        }
        function closeVideo() {
            document.getElementById("modal").style.display = "none";
        }

        // My List
        function addToList(name) {
            let list = JSON.parse(localStorage.getItem("myList")) || [];
            list.push(name);
            localStorage.setItem("myList", JSON.stringify(list));
            alert(name + " added!");
        }
    </script>

</body>

</html>
